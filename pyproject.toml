[project]
name = "agent-harness"
version = "0.1.0"
description = "Pluggable and observable coding agent harness"
readme = "README.md"
authors = [
    { name = "XI776", email = "3157941570@qq.com" }
]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
agent-harness = "agent_harness:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
